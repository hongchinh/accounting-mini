# ============================================================
# 24. AI BEHAVIOR RULES
# ============================================================

ai_rules:
  # read_before_write:
  # true = trước khi tạo/sửa phase, AI phải đọc các file cần thiết.
  read_before_write: true

  # do_not_pretend_file_access:
  # true = nếu AI không đọc được file/folder, phải nói rõ, không được giả vờ.
  do_not_pretend_file_access: true

  # ask_when_unclear:
  # true = nếu thiếu thông tin quan trọng, AI phải ghi issue hoặc hỏi user.
  ask_when_unclear: true

  # mark_assumptions:
  # true = mọi giả định phải ghi vào issues.md.
  mark_assumptions: true

  # stop_after_each_phase:
  # true = chạy xong phase phải dừng.
  stop_after_each_phase: true

  # require_user_approval:
  # true = cần user approve phase trước khi qua phase sau.
  require_user_approval: true

  # no_unrelated_changes:
  # true = không sửa file ngoài scope feature.
  no_unrelated_changes: true

  # preserve_user_reviewed_content:
  # true = khi cập nhật tài liệu đã review, không rewrite toàn bộ nếu không cần.
  preserve_user_reviewed_content: true


# ============================================================
# 25. FEATURE SIZE HINT
# ============================================================

feature_size:
  # size:
  # Gợi ý độ lớn feature.
  #
  # small:
  #   thay đổi nhỏ, ít file.
  #
  # medium:
  #   một màn hoặc một nhóm API.
  #
  # large:
  #   fullstack feature nhiều màn, API, DB, test.
  #
  # Danh mục nhà cung cấp là large.
  size: large

  # complexity:
  # Mức độ phức tạp nghiệp vụ.
  complexity: high

  # reason:
  # Lý do đánh giá.
  reason: Feature gồm UI danh sách, form, detail, API, database, permission, multi-tenant, export, test và visual review.


# ============================================================
# 26. REVIEW COMMANDS
# ============================================================

review_commands:
  approve:
    - approve phase {number}
    - duyệt phase {number}
    - ok phase {number}

  request_changes:
    - changes requested phase {number}: {notes}
    - sửa phase {number}: {notes}

  answer_issue:
    - answer item {ID}: {answer}
    - confirm item {ID}: {decision}

  confirm_coding:
    backend:
      - confirm backend coding
      - xác nhận code backend
    frontend:
      - confirm frontend coding
      - xác nhận code frontend

  visual_fix:
    - fix visual issues phase 9
    - fix visual issues P9
    - sửa UI theo visual review