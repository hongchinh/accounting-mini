# ============================================================
# 15. API EXPECTATION
# ============================================================

api:
  # base_path:
  # Base path API.
  base_path: /api/v1

  # endpoints:
  # API dự kiến. Phase 4 API Contract Review sẽ xác nhận lại.
  endpoints:
    - key: get-suppliers
      method: GET
      path: /api/v1/suppliers
      permission: supplier.view
      description: Lấy danh sách nhà cung cấp có paging/search/filter/sort.

    - key: get-supplier-detail
      method: GET
      path: /api/v1/suppliers/{id}
      permission: supplier.view
      description: Lấy chi tiết nhà cung cấp.

    - key: create-supplier
      method: POST
      path: /api/v1/suppliers
      permission: supplier.create
      description: Tạo mới nhà cung cấp.

    - key: update-supplier
      method: PUT
      path: /api/v1/suppliers/{id}
      permission: supplier.update
      description: Cập nhật nhà cung cấp.

    - key: delete-supplier
      method: DELETE
      path: /api/v1/suppliers/{id}
      permission: supplier.delete
      description: Xóa mềm nhà cung cấp.

    - key: bulk-delete-suppliers
      method: POST
      path: /api/v1/suppliers/bulk-delete
      permission: supplier.bulkDelete
      description: Xóa hàng loạt nhà cung cấp.

    - key: supplier-summary
      method: GET
      path: /api/v1/suppliers/summary
      permission: supplier.view
      description: Lấy tổng quan công nợ nhà cung cấp.

    - key: export-suppliers
      method: GET
      path: /api/v1/suppliers/export
      permission: supplier.export
      description: Xuất Excel danh sách nhà cung cấp.

    - key: update-supplier-address
      method: POST
      path: /api/v1/suppliers/update-address
      permission: supplier.updateAddress
      description: Cập nhật địa chỉ nhà cung cấp.

    - key: check-supplier-code
      method: GET
      path: /api/v1/suppliers/check-code
      permission: supplier.view
      description: Kiểm tra trùng mã nhà cung cấp.

    - key: check-supplier-tax-code
      method: GET
      path: /api/v1/suppliers/check-tax-code
      permission: supplier.view
      description: Kiểm tra trùng mã số thuế.


# ============================================================
# 16. PAGING / SORTING / FILTERING
# ============================================================

list_query:
  # page_index_base:
  # pageIndex bắt đầu từ 1 hay 0.
  #
  # Khuyến nghị backend API dùng 1.
  page_index_base: 1

  # default_page_size:
  # Page size mặc định.
  default_page_size: 100

  # max_page_size:
  # Page size tối đa để tránh query/export quá nặng.
  max_page_size: 500

  # searchable_fields:
  # Các field được search bởi keyword.
  searchable_fields:
    - supplierCode
    - supplierName
    - taxCode
    - phone
    - email
    - address

  # sortable_fields:
  # Whitelist các field được sort.
  sortable_fields:
    - supplierCode
    - supplierName
    - currentDebtAmount
    - updatedAt
    - createdAt

  # filters:
  # Bộ lọc dự kiến.
  filters:
    - status
    - supplierGroupId
    - provinceCode
    - hasDebt
    - isDebtNegative
    - minDebtAmount
    - maxDebtAmount
    - taxCode


# ============================================================
# 17. BUSINESS RULES
# ============================================================

business_rules:
  # AI phải đưa các rule này vào Backend Basic Design,
  # API Contract, Test Plan.
  - key: supplier-code-unique-per-tenant
    description: Mã nhà cung cấp là duy nhất trong từng tenant.
    source: config
    required: true

  - key: tax-code-unique-per-tenant
    description: Mã số thuế có thể cần duy nhất trong từng tenant, cần xác nhận nếu tài liệu không rõ.
    source: config
    required: false
    need_confirmation: true

  - key: soft-delete
    description: Xóa nhà cung cấp là xóa mềm.
    source: config
    required: true

  - key: cannot-delete-with-transactions
    description: Không cho xóa nhà cung cấp nếu đã phát sinh chứng từ hoặc công nợ.
    source: config
    required: true

  - key: tenant-isolation
    description: Chỉ được truy cập dữ liệu nhà cung cấp thuộc tenant hiện tại.
    source: config
    required: true

  - key: negative-debt-display
    description: Công nợ âm hiển thị màu đỏ và trong ngoặc ở frontend.
    source: config
    required: true


# ============================================================
# 18. VALIDATION RULES
# ============================================================

validation:
  SupplierCode:
    required: true
    max_length: 50
    unique_per_tenant: true
    description: Mã nhà cung cấp bắt buộc, không trùng trong tenant.

  SupplierName:
    required: true
    max_length: 255
    description: Tên nhà cung cấp bắt buộc.

  TaxCode:
    required: false
    max_length: 50
    unique_per_tenant: false
    need_confirmation: true
    description: Mã số thuế không bắt buộc, rule unique cần xác nhận.

  Email:
    required: false
    format: email
    max_length: 255

  Phone:
    required: false
    format: phone
    max_length: 50

  Address:
    required: false
    max_length: 500

  CurrentDebtAmount:
    required: false
    type: decimal
    allow_negative: true


# ============================================================
# 19. MULTI-TENANT CONFIG
# ============================================================

multi_tenant:
  # enabled:
  # true = feature bắt buộc hỗ trợ multi-tenant.
  enabled: true

  # tenant_source:
  # Cách xác định tenant.
  #
  # jwt_claim:
  #   Lấy từ JWT claim.
  #
  # header:
  #   Lấy từ header.
  #
  # jwt_claim_or_header:
  #   Ưu tiên JWT claim, fallback header.
  tenant_source: jwt_claim_or_header

  # tenant_header:
  # Header tenant nếu dùng.
  tenant_header: X-Tenant-Id

  # tenant_claim:
  # Claim tenant trong JWT.
  tenant_claim: tenant_id

  # frontend_query_key_include_tenant:
  # true = React Query key phải chứa tenantId.
  frontend_query_key_include_tenant: true

  # backend_enforce_tenant_filter:
  # true = mọi query backend phải filter TenantId.
  backend_enforce_tenant_filter: true

  # block_cross_tenant_access:
  # true = không cho user tenant A truy cập data tenant B.
  block_cross_tenant_access: true


# ============================================================
# 20. SECURITY CONFIG
# ============================================================

security:
  # authentication_required:
  # true = API cần JWT.
  authentication_required: true

  # authorization_required:
  # true = API cần permission.
  authorization_required: true

  # permission_based_ui:
  # true = frontend phải ẩn/disable UI theo permission.
  permission_based_ui: true

  # protect_export:
  # true = export Excel phải kiểm tra permission.
  protect_export: true

  # prevent_over_posting:
  # true = backend không bind trực tiếp entity từ request.
  prevent_over_posting: true

  # expose_entity_directly:
  # false = API không trả EF entity trực tiếp.
  expose_entity_directly: false


# ============================================================
# 21. TEST CONFIG
# ============================================================

testing:
  # backend:
  # Cấu hình test backend.
  backend:
    enabled: true
    framework: xUnit
    assertion_library: FluentAssertions
    mock_library: Moq
    integration_test: true
    tenant_isolation_test: true
    permission_test: true

  # frontend:
  # Cấu hình test frontend.
  frontend:
    enabled: true
    framework: Vitest
    component_testing: React Testing Library
    api_mocking: MSW
    e2e: Playwright
    permission_test: true
    loading_empty_error_test: true

  # integration:
  # Cấu hình integration test.
  integration:
    enabled: true
    test_api_contract: true
    test_auth: true
    test_permission: true
    test_tenant: true
    test_paging_search_filter_sort: true


# ============================================================
# 22. COMMANDS
# ============================================================

commands:
  # Các command gợi ý để AI biết cách chạy project/test.
  #
  # Nếu command thực tế khác, AI phải đọc package.json/.csproj
  # hoặc hỏi user.
  frontend_install: npm install
  frontend_dev: npm run dev
  frontend_build: npm run build
  frontend_test: npm run test
  frontend_typecheck: npm run typecheck

  backend_restore: dotnet restore
  backend_build: dotnet build
  backend_test: dotnet test
  backend_run: dotnet run
  backend_migration_add: dotnet ef migrations add AddSuppliers
  backend_database_update: dotnet ef database update


